<!DOCTYPE html>
<html lang="en" data-theme="dark" data-lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jon Jiang | 404</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="dark light">
  <script>
    /* 沿用首頁記住的語言與主題 */
    (function () {
      var d = document.documentElement, t = 'dark', l = 'en';
      try { t = localStorage.getItem('theme') || t; l = localStorage.getItem('lang') || l; } catch (e) {}
      d.dataset.theme = t === 'light' ? 'light' : 'dark';
      d.dataset.lang = l === 'en' ? 'en' : 'zh';
      d.lang = l === 'en' ? 'en' : 'zh-Hant';
      document.title = (l === 'en' ? 'Jon Jiang' : '江仲元') + ' | 404';
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    /* 配色與首頁相同，這頁自成一體，不依賴其他檔案 */
    :root {
      color-scheme: dark;
      --bg: #0f0e17; --fg: #fffffe; --dim: #a7a9be; --red: #e53170; --orange: #ff8906; --green: #ff8906;
      --panel: rgba(255, 255, 254, 0.04);
      --panel-line: rgba(255, 255, 254, 0.14); --hi: transparent; --titlebar: rgba(0, 0, 0, 0.25);
      --shadow: 0 0 0 1px rgba(0, 0, 0, 0.6), 0 0 60px rgba(255, 255, 254, 0.04), 0 24px 80px rgba(0, 0, 0, 0.7);
      --btn: rgba(255, 255, 254, 0.08);
      --mono: "JetBrains Mono", "JetBrainsMono Nerd Font", ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    html[data-theme="light"] {
      color-scheme: light;
      --bg: #f8f5f2; --fg: #232323; --dim: #5f6262; --red: #f45d48; --orange: #078080; --green: #078080;
      --panel: rgba(35, 35, 35, 0.03);
      --panel-line: rgba(35, 35, 35, 0.14); --hi: transparent; --titlebar: rgba(35, 35, 35, 0.05);
      --shadow: 0 0 0 1px rgba(35, 35, 35, 0.04), 0 24px 60px rgba(35, 35, 35, 0.12);
      --btn: rgba(35, 35, 35, 0.06);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; min-height: 100svh;
      display: flex; align-items: center; justify-content: center; padding: 24px 20px;
      background: var(--bg); color: var(--fg);
      font-family: var(--mono); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased;
    }
    html[data-lang="zh"] .en, html[data-lang="en"] .zh { display: none !important; }

    .window {
      width: min(640px, 100%); overflow: hidden;
      background: var(--panel); border: 1px solid var(--panel-line); border-radius: 14px;
      -webkit-backdrop-filter: blur(28px); backdrop-filter: blur(28px);
      box-shadow: inset 0 1px 0 var(--hi), var(--shadow);
    }
    .titlebar {
      display: flex; align-items: center; gap: 8px; padding: 10px 14px;
      border-bottom: 1px solid var(--panel-line); background: var(--titlebar); color: var(--dim); font-size: 12px;
    }
    .dot { width: 11px; height: 11px; border-radius: 50%; opacity: .6; }
    .dot.r { background: #ff5f57; } .dot.y { background: #febc2e; } .dot.g { background: #28c840; }   /* 紅綠燈：macOS 固定色，與首頁一致，不隨主題變 */
    .path { margin-left: 8px; }
    .content { padding: 28px clamp(18px, 4vw, 36px) 32px; }

    .prompt::before { content: "❯ "; color: var(--orange); }
    .err { color: var(--red); margin: 6px 0 4px; overflow-wrap: anywhere; }
    .code { font-size: clamp(56px, 16vw, 96px); font-weight: 700; line-height: 1.1; margin: 18px 0 4px; }
    .msg { color: var(--dim); margin: 0 0 22px; }
    a.btn {
      display: inline-block; padding: 8px 16px; border-radius: 10px; color: var(--fg); text-decoration: none;
      background: var(--btn); border: 1px solid var(--panel-line); transition: background .2s, border-color .2s;
    }
    a.btn:hover, a.btn:focus-visible { border-color: var(--dim); outline: none; }
    .btn b { color: var(--green); font-weight: 500; }
    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      :root { --panel: rgba(15, 14, 23, 0.94); }
      html[data-theme="light"] { --panel: rgba(248, 245, 242, 0.94); }
    }
  </style>
</head>
<body>
  <main class="window">
    <div class="titlebar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="path">~ — zsh</span></div>
    <div class="content">
      <div class="prompt">cd <span id="path">/this/page</span></div>
      <div class="err">zsh: no such file or directory: <span id="path2">/this/page</span></div>
      <div class="code">404</div>
      <p class="msg"><span class="en">That page doesn't exist.</span><span class="zh">找不到這個頁面。</span></p>
      <a class="btn" href="/"><b>cd</b> ~ <span class="en">&nbsp;· back home</span><span class="zh">&nbsp;· 回首頁</span></a>
    </div>
  </main>

  <script>
    /* 顯示使用者實際輸入的路徑（用 textContent，不會被當成 HTML） */
    var p = location.pathname || '/';
    document.getElementById('path').textContent = p;
    document.getElementById('path2').textContent = p;
  </script>
</body>
</html>
